<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>Gestão Financeira</title>
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Finanças</h1>
            <div class="balance-card">
                <p class="balance-label">Saldo Total</p>
                <h2 class="balance-value" id="totalBalance">R$ 0,00</h2>
                <div class="balance-details">
                    <div class="balance-item income">
                        <span class="label">Receitas</span>
                        <span class="value" id="totalIncome">R$ 0,00</span>
                    </div>
                    <div class="balance-item expense">
                        <span class="label">Despesas</span>
                        <span class="value" id="totalExpense">R$ 0,00</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="income">Receitas</button>
            <button class="filter-btn" data-filter="expense">Despesas</button>
        </div>

        <div class="transactions-container">
            <div class="transactions-header">
                <h3>Transações</h3>
            </div>
            <div class="transactions-list" id="transactionsList">
                <div class="empty-state">
                    <p>💰 Nenhuma transação registrada</p>
                </div>
            </div>
        </div>

        <button class="fab" id="openModalBtn">+</button>

        <footer class="footer">
            <p>Desenvolvido por <strong>Artur Camara</strong></p>
        </footer>
    </div>

    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nova Transação</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="amount">Valor (R$)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="type">Tipo</label>
                    <div class="type-selector">
                        <label class="radio-label">
                            <input type="radio" name="type" value="income" checked>
                            <span class="radio-custom income">💚 Receita</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="type" value="expense">
                            <span class="radio-custom expense">❤️ Despesa</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Adicionar</button>
            </form>
        </div>
    </div>

    <script src="scripts/storage.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
